include ~/.config/kitty/colors.conf

shell zsh
font_family      JetBrainsMono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

background_opacity 0.8
background_blur 0
window_padding_width 15 20 15 20
scrollback_indicator_opacity 0

# Stop kitty remembering "maximized" and re-requesting it, which drops the gaps and red border
remember_window_size no

# Ghost cursor trail (shaders from github.com/sahaj-b/ghostty-cursor-shaders);
# trail colour follows the cursor colour, which apply-theme.sh sets to the wallpaper accent
cursor_trail 1
custom_shaders cursor-warp

# Solid block cursor, no blinking; no-cursor stops shell integration
# switching it to a beam at the prompt
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Close windows without the "Are you sure?" prompt
confirm_os_window_close 0
