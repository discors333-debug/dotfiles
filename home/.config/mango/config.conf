# More option see https://github.com/DreamMaoMao/mango/wiki/

# Startup programs (waybar, wallpaper daemon, clipboard history)
exec-once=~/.config/mango/autostart.sh

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 3
blur_params_noise = 0.02
blur_params_brightness = 1.0
blur_params_contrast = 1.0
blur_params_saturation = 1.0

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 4
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x1a1a1aee

border_radius=15
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=20
gappov=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x0a0a0aff
bordercolor=0x404040aa
dropcolor=0xffffff55
splitcolor=0xffffffff
focuscolor=0xffffffff
maximizescreencolor=0xffffffff
urgentcolor=0xffffffff
scratchpadcolor=0xffffffff
globalcolor=0xffffffff
overlaycolor=0xffffffff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller

# layouts (all tags start as tile)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# larp script windows (~/.local/bin/larp) always open on workspace 9
windowrule=tags:9,appid:larp

# Monitors (ported from hyprland: portrait HDMI-A-2 left of main DP-5)
monitorrule=name:HDMI-A-2,width:2560,height:1440,refresh:144,x:0,y:0,scale:1,rr:1
monitorrule=name:DP-5,width:2560,height:1440,refresh:200,x:1440,y:800,scale:1,rr:0

# Key bindings (SUPER-based, mirroring the hyprland setup)
bind=SUPER,Return,spawn,kitty
bind=SUPER,q,spawn,kitty
bind=SUPER,n,spawn,kitty --title claude claude
bind=SUPER,space,spawn,~/.config/rofi/launchers/type-4/launcher.sh
bind=SUPER,e,spawn,dolphin
bind=SUPER+ALT,f,spawn,firefox
bind=SUPER,w,killclient,
bind=SUPER,m,quit
bind=SUPER,bracketright,reload_config

# focus / move windows
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# window state
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER,j,switch_layout

# Set layout directly: Super+Shift+Alt+key
bind=SUPER+SHIFT+ALT,1,setlayout,tile
bind=SUPER+SHIFT+ALT,2,setlayout,dwindle
bind=SUPER+SHIFT+ALT,3,setlayout,scroller
bind=SUPER+SHIFT+ALT,4,setlayout,grid
bind=SUPER+SHIFT+ALT,5,setlayout,monocle
bind=SUPER+SHIFT+ALT,6,setlayout,deck
bind=SUPER+SHIFT+ALT,7,setlayout,fair
bind=SUPER+SHIFT+ALT,8,setlayout,right_tile
bind=SUPER,s,toggle_scratchpad
bind=SUPER,r,spawn,~/.config/mango/wallpaper.sh

# tags (workspaces)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,z,viewtoleft,0
bind=SUPER,x,viewtoright,0
bind=SUPER+SHIFT,z,tagtoleft,0
bind=SUPER+SHIFT,x,tagtoright,0

# monitors
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# resize / gaps
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=SUPER+ALT,g,togglegaps

# screenshots, media, volume, brightness
# Spectacle-style: Print or Super+A = mode menu, Shift = region, Super = active window, Ctrl = all screens
bind=NONE,Print,spawn,~/.config/mango/screenshot.sh
bind=SUPER,a,spawn,~/.config/mango/screenshot.sh
bind=SHIFT,Print,spawn,~/.config/mango/screenshot.sh region
bind=SUPER,Print,spawn,~/.config/mango/screenshot.sh active
bind=CTRL,Print,spawn,~/.config/mango/screenshot.sh all
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rules
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
