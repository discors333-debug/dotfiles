# ~/.tmux.conf -- dashboard/tiled look: thick black pane borders, minimal status bar

# True color / kitty terminfo passthrough, so colors and the kitty image
# protocol (fastfetch --logo-type kitty, icat, etc.) still work inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough on

# "heavy" uses thicker box-drawing characters for pane borders than the
# tmux default ("single"), which is the closest tmux gets to a "thick"
# native border -- tmux borders are one character cell wide, it can't do
# an arbitrary pixel thickness. See note below for a thicker-looking option.
set -g pane-border-lines heavy

# Solid black borders; the active pane's border also goes bold so it still
# reads clearly even though it's the same color as the inactive one.
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=black,bold"

# Kill the status bar entirely for a clean dashboard look.
# (Swap to the two lines below instead if you want a slim 1-line status
# rather than none at all.)
set -g status off
# set -g status-style "bg=black,fg=colour240"
# set -g status-left "" ; set -g status-right "" ; set -g status-interval 60

# Small QoL: renumber panes/windows and don't wait after prefix.
set -g renumber-windows on
set -sg escape-time 0
